name: CI-CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (leave empty = this commit's SHA)"
        required: false
        default: ""
      skip_image_check:
        description: "Skip the pre-deploy image check (for the rollback demo only)"
        type: boolean
        default: false

env:
  PROJECT_ID: arnav-cicd-1101
  REGION: asia-south1
  ZONE: asia-south1-a
  CLUSTER_NAME: gke-cicd
  REPO: cicd-repo
  IMAGE_NAME: cicd-demo

jobs:
  secret-scan:
    name: 0. Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: 1. Build & Test (Maven)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile, run tests, package
        run: mvn -B clean package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  docker:
    name: 2. Build & Push Docker Image
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build and tag image
        run: |
          IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE_NAME
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push image to Artifact Registry
        run: docker push --all-tags $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE_NAME

  deploy:
    name: 3. Deploy to GKE (Ansible) & Verify
    needs: docker
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.image_tag || github.sha }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.ZONE }}

      - name: Pre-deploy check - image tag exists
        if: github.event.inputs.skip_image_check != 'true'
        run: |
          IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE_NAME:$TAG
          echo "Checking that $IMAGE exists..."
          if gcloud artifacts docker images describe "$IMAGE" > /dev/null 2>&1; then
            echo "Image found."
          else
            echo "::error::Image tag '$TAG' not found in Artifact Registry. Deployment aborted; cluster untouched."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          pip install ansible kubernetes
          ansible-galaxy collection install kubernetes.core

      - name: Deploy with Ansible
        id: deploy
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            -e image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE_NAME:$TAG

      - name: Post-deploy check - correct image is running
        run: |
          EXPECTED=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE_NAME:$TAG
          DEPLOYED=$(kubectl get deployment cicd-demo -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Expected: $EXPECTED"
          echo "Deployed: $DEPLOYED"
          if [ "$DEPLOYED" != "$EXPECTED" ]; then
            echo "::error::Deployed image does not match the expected tag."
            exit 1
          fi

      - name: Verify deployment status
        run: |
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get svc cicd-demo-service

      - name: Verify application availability
        run: |
          for i in $(seq 1 30); do
            IP=$(kubectl get svc cicd-demo-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$IP" ] && break
            echo "Waiting for external IP..."; sleep 10
          done
          echo "App URL: http://$IP"
          curl --fail --retry 10 --retry-delay 6 --retry-all-errors http://$IP/

      - name: Automatic rollback on failure
        if: failure() && steps.deploy.outcome != 'skipped'
        run: |
          echo "::warning::Deployment failed - rolling back to the previous version."
          kubectl get pods
          kubectl get events --sort-by=.lastTimestamp | tail -10
          kubectl rollout undo deployment/cicd-demo
          kubectl rollout status deployment/cicd-demo --timeout=120s
          kubectl get pods
